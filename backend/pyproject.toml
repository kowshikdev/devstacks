[project]
name = "devstacks-backend"
version = "0.1.0"
description = "Evidence graph API and domain services for DevStacks"
requires-python = ">=3.11"
dependencies = [
	"cryptography>=46,<47",
	"fastapi>=0.135,<0.142",
	"httpx>=0.28,<0.29",
	"uvicorn[standard]>=0.48,<0.53",
]

[project.optional-dependencies]
test = [
	"pytest>=8.0,<9.0",
]
agent = [
	"deepagents",
	"langgraph",
	"langgraph-checkpoint-postgres",
	"psycopg[binary,pool]",
	"langchain-openai",
]

[project.scripts]
devstacks-github-worker = "devstacks_api.github_worker_cli:main"
devstacks-claims-worker = "devstacks_agent.agent_worker_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
